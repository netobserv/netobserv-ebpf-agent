name: Push PR image to quay.io
on:
  workflow_run:
    workflows: ["Build PR image and upload artifact"]
    types:
      - completed

permissions: {}

env:
  WF_REGISTRY_USER: netobserv+ebpf-agent_github_ci
  WF_REGISTRY: quay.io/netobserv
  WF_IMAGE: netobserv-ebpf-agent
  WF_BC_IMAGE: ebpf-bytecode

jobs:
  push-pr-image:
    # Build workflow now pushes images and posts the PR comment directly.
    # Keep this job disabled until main drops the inlined push from build_image_pr.yml.
    if: false
    name: push PR image
    runs-on: ubuntu-latest
    outputs:
      pr_id: ${{ steps.extract.outputs.pr_id }}
      short_sha: ${{ steps.extract.outputs.short_sha }}
      main_image: ${{ steps.extract.outputs.main_image }}
      bc_flow_image: ${{ steps.extract.outputs.bc_flow_image }}
      bc_packet_image: ${{ steps.extract.outputs.bc_packet_image }}
    steps:
      - run: echo "deprecated - push is handled in build_image_pr.yml"
