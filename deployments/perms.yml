kind: Namespace
apiVersion: v1
metadata:
  name: netobserv
  labels:
    app: netobserv
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netobserv
  namespace: netobserv
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: netobserv
  namespace: netobserv
rules:
  - apiGroups:
     - security.openshift.io
    resourceNames:
     - privileged
    resources:
     - securitycontextconstraints
    verbs:
     - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netobserv
  namespace: netobserv
subjects:
  - kind: ServiceAccount
    name: netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv
---
# Only needed when METRICS_AUTH_TYPE=kubernetes, to let the agent authenticate and
# authorize the clients scraping its metrics endpoint. TokenReview and SubjectAccessReview
# are cluster-scoped, hence a ClusterRoleBinding rather than a RoleBinding.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: netobserv-metrics-auth
rules:
  - apiGroups:
     - authentication.k8s.io
    resources:
     - tokenreviews
    verbs:
     - create
  - apiGroups:
     - authorization.k8s.io
    resources:
     - subjectaccessreviews
    verbs:
     - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netobserv-metrics-auth
subjects:
  - kind: ServiceAccount
    name: netobserv
    namespace: netobserv
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-metrics-auth
